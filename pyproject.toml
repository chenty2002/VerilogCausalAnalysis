[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verilog-causal-analysis"
version = "2.2.0"
description = "Deterministic causal slicing for Verilog counterexample traces"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "pylibfst>=0.1.0",
]

[project.optional-dependencies]
visualization = ["graphviz>=0.20.1"]
parser = ["hdlConvertor>=2.3", "hdlConvertorAst>=1.2"]
test = ["pytest>=8"]

[project.scripts]
verilog-causal-analysis = "verilog_causal_analysis.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
